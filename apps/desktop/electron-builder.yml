# electron-builder 打包配置
# 产物输出到 apps/desktop/dist/（不入库）
#
# 国内网络下载 electron 分发二进制容易超时（会卡在 packaging 阶段），可用镜像：
#   ELECTRON_MIRROR=https://npmmirror.com/mirrors/electron/ \
#   ELECTRON_BUILDER_BINARIES_MIRROR=https://npmmirror.com/mirrors/electron-builder-binaries/ \
#   pnpm dist
appId: com.kuxi.app
productName: 库犀
copyright: Copyright © 2024 库犀

directories:
  output: dist
  buildResources: build

# 只打包 electron-vite 的编译产物 + package.json。
# main/preload 里被 external 的运行时依赖（electron-updater / mysql2 / pg）
# 由 electron-builder 依据 dependencies 自动收进 asar，无需在此列出。
files:
  - out/**/*
  - package.json
  - '!**/*.map'

asar: true
compression: maximum
# SQLite 走 Node 内置 node:sqlite，没有需要重编译的原生模块
npmRebuild: false

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  # 只产 zip：自动更新（Squirrel.Mac）只认 zip 增量包。
  # DMG 由 hdiutil 手工制作（见文件末尾「DMG 制作」注释），
  # 因为 electron-builder 内置的 dmgbuild 在 macOS 26 上写入挂载卷会 EPERM 失败。
  target:
    - target: zip
      arch: [arm64, x64]
  # 本地开发机通常没有 Apple Developer 证书，这里跳过签名以便能打出包。
  # 正式分发时删掉 identity: null，并配置 CSC_LINK / CSC_KEY_PASSWORD + 公证（notarize）。
  identity: null
  # 文件名用 ASCII，避免下载链接/第三方 CDN 对中文名做编码时出错（应用内名称仍是「库犀」）
  artifactName: Kuxi-${version}-${arch}.${ext}

# DMG 制作（electron-builder 不参与，手动跑）：
#   cd apps/desktop/dist
#   mkdir -p .stage && cp -R mac-arm64/库犀.app .stage/ && ln -s /Applications .stage/Applications
#   hdiutil create -volname "库犀" -srcfolder .stage -ov -format UDZO Kuxi-<version>-arm64.dmg
#   同理用 mac/库犀.app 产 x64 版本

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
  artifactName: Kuxi-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: 库犀
  deleteAppDataOnUninstall: false

linux:
  icon: build/icon.png
  target:
    - target: AppImage
      arch: [x64]
  category: Development
  artifactName: Kuxi-${version}-${arch}.${ext}

# 更新源：GitHub Releases。
# 打包时会生成 app-update.yml（owner/repo），应用内 electron-updater 直接读该仓库
# 最新 Release 的 latest-mac.yml / latest.yml 做版本比对与增量下载。
# 发版流程：打 tag（如 v0.1.1）→ 构建 → 把安装包 + latest*.yml 一起上传到对应 Release。
publish:
  provider: github
  owner: ITxuezhe
  repo: kuxi
